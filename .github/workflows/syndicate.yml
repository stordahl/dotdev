name: Syndicate to standard.site

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
  workflow_dispatch:

concurrency:
  group: syndicate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syndicate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to atproto
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
        run: pnpm exec sequoia publish

      - name: Sync state and update frontmatter
        run: pnpm exec sequoia sync --update-frontmatter

      - name: Commit atUri updates back to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update AT Protocol URIs'
          file_pattern: src/content/blog/*.md .sequoia-state.json
